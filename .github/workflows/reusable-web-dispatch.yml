name: Reusable Complete Web Build Dispatcher

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      source_branch:
        required: true
        type: string
      image_tag:
        required: false
        default: ""
        type: string
      actor:
        required: false
        default: ""
        type: string
      event:
        required: false
        default: ""
        type: string
    secrets:
      DOCKER_WEB_DISPATCH_TOKEN:
        required: true
      SMTP_HOST:
        required: false
      SMTP_PORT:
        required: false
      SMTP_USERNAME:
        required: false
      SMTP_PASSWORD:
        required: false
      SMTP_FROM:
        required: false
      MAIL_RECIPIENTS_JSON:
        required: false

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Check out build configuration
        uses: actions/checkout@v4
        with:
          repository: jumpserver-east/docker-web
          ref: docker-build
          path: build-config
          fetch-depth: 1

      - name: Resolve matching component branches
        id: refs
        shell: bash
        env:
          COMPONENT: ${{ inputs.component }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail
          python3 build-config/.github/scripts/resolve-web-refs.py \
            --component "${COMPONENT}" \
            --source-branch "${SOURCE_BRANCH}" \
            --source-ref "$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Preserve original build trigger
        id: origin
        shell: bash
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          NOTIFICATION_ACTOR: ${{ inputs.actor || github.triggering_actor || github.actor }}
          NOTIFICATION_EVENT: ${{ inputs.event || github.event_name }}
        run: |
          set -euo pipefail
          context="$(jq -nc --arg repository "${GITHUB_REPOSITORY}" \
            --arg branch "${SOURCE_BRANCH}" --arg ref "$(git rev-parse HEAD)" \
            --arg event "${NOTIFICATION_EVENT}" --arg actor "${NOTIFICATION_ACTOR}" \
            '{repository: $repository, branch: $branch, ref: $ref, event: $event, actor: $actor}')"
          echo "context=${context}" >> "${GITHUB_OUTPUT}"

      - name: Prepare tag
        id: request
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED_TAG}" ]; then
            raw_tag="${REQUESTED_TAG}"
          else
            timestamp="$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M%S')"
            raw_tag="${SOURCE_BRANCH}-${timestamp}"
          fi

          tag="$(
            printf '%s' "${raw_tag}" |
              tr '[:upper:]' '[:lower:]' |
              sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' |
              cut -c1-128
          )"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch Docker Web workflow
        shell: bash
        env:
          NOTIFICATION_CONTEXT: ${{ steps.origin.outputs.context }}
          DISPATCH_TOKEN: ${{ secrets.DOCKER_WEB_DISPATCH_TOKEN }}
          LINA_REF: ${{ steps.refs.outputs.LINA_REF }}
          LUNA_REF: ${{ steps.refs.outputs.LUNA_REF }}
          WEB_REF: ${{ steps.refs.outputs.WEB_REF }}
          IMAGE_TAG: ${{ steps.request.outputs.tag }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail

          payload="$(jq -nc \
            --arg ref "docker-build" \
            --arg notification_context "${NOTIFICATION_CONTEXT}" \
            --arg branch "${SOURCE_BRANCH}" \
            --arg lina_branch "${LINA_REF}" \
            --arg luna_branch "${LUNA_REF}" \
            --arg web_branch "${WEB_REF}" \
            --arg tag "${IMAGE_TAG}" \
            '{
              ref: $ref,
              inputs: {
                branch: $branch,
                notification_context: $notification_context,
                lina_branch: $lina_branch,
                luna_branch: $luna_branch,
                web_branch: $web_branch,
                tag: $tag
              }
            }'
          )"

          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "${payload}" \
            "https://api.github.com/repos/jumpserver-east/docker-web/actions/workflows/build-web-image.yml/dispatches"

      - name: Publish summary
        shell: bash
        env:
          COMPONENT: ${{ inputs.component }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          LINA_REF: ${{ steps.refs.outputs.LINA_REF }}
          LUNA_REF: ${{ steps.refs.outputs.LUNA_REF }}
          WEB_REF: ${{ steps.refs.outputs.WEB_REF }}
          IMAGE_TAG: ${{ steps.request.outputs.tag }}
        run: |
          {
            echo "### Complete Web build dispatched"
            echo
            echo "Component: \`${COMPONENT}\`"
            echo
            echo "Branch: \`${SOURCE_BRANCH}\`"
            echo
            echo "Lina: \`${LINA_REF}\`"
            echo
            echo "Luna: \`${LUNA_REF}\`"
            echo
            echo "Docker Web: \`${WEB_REF}\`"
            echo
            echo "Tag: \`${IMAGE_TAG}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  notify-dispatch-failure:
    needs: dispatch
    if: ${{ always() && contains(fromJSON('["failure", "cancelled"]'), needs.dispatch.result) }}
    uses: jumpserver-east/docker-web/.github/workflows/notify-image-build.yml@docker-build
    with:
      result: ${{ needs.dispatch.result }}
      phase: dispatch
      image: ${{ format('ghcr.io/jumpserver-east/web:{0}', inputs.image_tag || 'not-generated') }}
      source_repository: ${{ github.repository }}
      source_branch: ${{ inputs.source_branch }}
      source_ref: ${{ inputs.source_ref }}
      actor: ${{ inputs.actor || github.triggering_actor || github.actor }}
      event: ${{ inputs.event || github.event_name }}
    secrets:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      MAIL_RECIPIENTS_JSON: ${{ secrets.MAIL_RECIPIENTS_JSON }}
