name: Reusable Complete Web Build Dispatcher

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      source_branch:
        required: true
        type: string
      image_tag:
        required: false
        default: ""
        type: string
    secrets:
      DOCKER_WEB_DISPATCH_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Check out build configuration
        uses: actions/checkout@v4
        with:
          repository: jumpserver-east/docker-web
          ref: docker-build
          path: build-config
          fetch-depth: 1

      - name: Resolve matching component branches
        id: refs
        shell: bash
        env:
          COMPONENT: ${{ inputs.component }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail
          python3 build-config/.github/scripts/resolve-web-refs.py \
            --component "${COMPONENT}" \
            --source-branch "${SOURCE_BRANCH}" \
            --source-ref "$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Prepare tag
        id: request
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED_TAG}" ]; then
            raw_tag="${REQUESTED_TAG}"
          else
            timestamp="$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M%S')"
            raw_tag="${SOURCE_BRANCH}-${timestamp}"
          fi

          tag="$(
            printf '%s' "${raw_tag}" |
              tr '[:upper:]' '[:lower:]' |
              sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' |
              cut -c1-128
          )"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch Docker Web workflow
        shell: bash
        env:
          DISPATCH_TOKEN: ${{ secrets.DOCKER_WEB_DISPATCH_TOKEN }}
          LINA_REF: ${{ steps.refs.outputs.LINA_REF }}
          LUNA_REF: ${{ steps.refs.outputs.LUNA_REF }}
          WEB_REF: ${{ steps.refs.outputs.WEB_REF }}
          IMAGE_TAG: ${{ steps.request.outputs.tag }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail

          payload="$(jq -nc \
            --arg ref "docker-build" \
            --arg branch "${SOURCE_BRANCH}" \
            --arg lina_branch "${LINA_REF}" \
            --arg luna_branch "${LUNA_REF}" \
            --arg web_branch "${WEB_REF}" \
            --arg tag "${IMAGE_TAG}" \
            '{
              ref: $ref,
              inputs: {
                branch: $branch,
                lina_branch: $lina_branch,
                luna_branch: $luna_branch,
                web_branch: $web_branch,
                tag: $tag
              }
            }'
          )"

          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "${payload}" \
            "https://api.github.com/repos/jumpserver-east/docker-web/actions/workflows/build-web-image.yml/dispatches"

      - name: Publish summary
        shell: bash
        env:
          COMPONENT: ${{ inputs.component }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          LINA_REF: ${{ steps.refs.outputs.LINA_REF }}
          LUNA_REF: ${{ steps.refs.outputs.LUNA_REF }}
          WEB_REF: ${{ steps.refs.outputs.WEB_REF }}
          IMAGE_TAG: ${{ steps.request.outputs.tag }}
        run: |
          {
            echo "### Complete Web build dispatched"
            echo
            echo "Component: \`${COMPONENT}\`"
            echo
            echo "Branch: \`${SOURCE_BRANCH}\`"
            echo
            echo "Lina: \`${LINA_REF}\`"
            echo
            echo "Luna: \`${LUNA_REF}\`"
            echo
            echo "Docker Web: \`${WEB_REF}\`"
            echo
            echo "Tag: \`${IMAGE_TAG}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
