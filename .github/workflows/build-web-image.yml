name: Build Complete Web Image to GHCR

on:
  create:
  workflow_run:
    workflows:
      - JumpServer repos generic handler
    types:
      - completed
  workflow_dispatch:
    inputs:
      component:
        description: Repository that triggered this build
        required: true
        default: web
        type: choice
        options:
          - web
          - lina
          - luna
      source_ref:
        description: Branch, tag, or commit SHA from the triggering repository
        required: true
        default: dev
        type: string
      source_branch:
        description: Branch name used for image tagging and counterpart lookup
        required: true
        default: dev
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: web-${{ inputs.component || 'web' }}-${{ github.event.workflow_run.head_sha || inputs.source_ref || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'create' && github.event.ref_type == 'branch') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Resolve trigger
        id: trigger
        shell: bash
        env:
          CREATE_REF: ${{ github.event.ref }}
          INPUT_COMPONENT: ${{ inputs.component }}
          INPUT_SOURCE_BRANCH: ${{ inputs.source_branch }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          case "${GITHUB_EVENT_NAME}" in
            workflow_run)
              component="web"
              source_ref="${WORKFLOW_RUN_SHA}"
              source_branch="${WORKFLOW_RUN_BRANCH}"
              ;;
            create)
              component="web"
              source_ref="${CREATE_REF}"
              source_branch="${CREATE_REF}"
              ;;
            workflow_dispatch)
              component="${INPUT_COMPONENT}"
              source_ref="${INPUT_SOURCE_REF}"
              source_branch="${INPUT_SOURCE_BRANCH}"
              ;;
          esac

          case "${component}" in
            web|lina|luna) ;;
            *)
              echo "Unsupported component: ${component}" >&2
              exit 1
              ;;
          esac

          echo "component=${component}" >> "${GITHUB_OUTPUT}"
          echo "source_ref=${source_ref}" >> "${GITHUB_OUTPUT}"
          echo "source_branch=${source_branch}" >> "${GITHUB_OUTPUT}"

      - name: Resolve Lina, Luna, and Docker Web revisions
        id: revisions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ steps.trigger.outputs.component }}
          SOURCE_BRANCH: ${{ steps.trigger.outputs.source_branch }}
          SOURCE_REF: ${{ steps.trigger.outputs.source_ref }}
        run: |
          set -euo pipefail

          encode_ref() {
            jq -rn --arg value "$1" '$value | @uri'
          }

          resolve_commit() {
            local repository="$1"
            local ref="$2"
            local encoded_ref
            encoded_ref="$(encode_ref "${ref}")"
            gh api "repos/jumpserver-east/${repository}/commits/${encoded_ref}" --jq '.sha'
          }

          matching_branch_or_dev() {
            local repository="$1"
            local branch="$2"
            local encoded_branch
            encoded_branch="$(encode_ref "${branch}")"

            if gh api "repos/jumpserver-east/${repository}/branches/${encoded_branch}" \
              --jq '.commit.sha' 2>/dev/null; then
              return
            fi

            gh api "repos/jumpserver-east/${repository}/branches/dev" --jq '.commit.sha'
          }

          case "${COMPONENT}" in
            lina)
              lina_ref="$(resolve_commit lina "${SOURCE_REF}")"
              luna_ref="$(matching_branch_or_dev luna "${SOURCE_BRANCH}")"
              web_ref="$(resolve_commit docker-web dev)"
              ;;
            luna)
              lina_ref="$(matching_branch_or_dev lina "${SOURCE_BRANCH}")"
              luna_ref="$(resolve_commit luna "${SOURCE_REF}")"
              web_ref="$(resolve_commit docker-web dev)"
              ;;
            web)
              lina_ref="$(matching_branch_or_dev lina "${SOURCE_BRANCH}")"
              luna_ref="$(matching_branch_or_dev luna "${SOURCE_BRANCH}")"
              web_ref="$(resolve_commit docker-web "${SOURCE_REF}")"
              ;;
          esac

          {
            echo "lina=${lina_ref}"
            echo "luna=${luna_ref}"
            echo "web=${web_ref}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out build configuration
        uses: actions/checkout@v4
        with:
          ref: docker-build
          fetch-depth: 1

      - name: Check out Docker Web source revision
        uses: actions/checkout@v4
        with:
          repository: jumpserver-east/docker-web
          ref: ${{ steps.revisions.outputs.web }}
          path: web-source
          fetch-depth: 1

      - name: Prepare image metadata
        id: image
        shell: bash
        env:
          SOURCE_BRANCH: ${{ steps.trigger.outputs.source_branch }}
        run: |
          set -euo pipefail

          branch_tag="$(
            printf '%s' "${SOURCE_BRANCH}" |
              tr '[:upper:]' '[:lower:]' |
              sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' |
              cut -c1-100
          )"
          timestamp="$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M%S')"

          if [ -z "${branch_tag}" ]; then
            branch_tag="revision"
          fi

          echo "image=ghcr.io/jumpserver-east/web" >> "${GITHUB_OUTPUT}"
          echo "tag=${branch_tag}-${timestamp}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Lina, Luna, and complete Web image
        uses: docker/bake-action@v6
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ steps.image.outputs.tag }}
          LINA_REF: ${{ steps.revisions.outputs.lina }}
          LUNA_REF: ${{ steps.revisions.outputs.luna }}
          WEB_REF: ${{ steps.revisions.outputs.web }}
        with:
          files: docker-bake.ghcr.hcl
          targets: web
          push: true
          set: |
            *.platform=${{ vars.DOCKER_PLATFORMS || 'linux/amd64' }}

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "### Complete JumpServer Web image"
            echo
            echo "Trigger: \`${{ steps.trigger.outputs.component }}:${{ steps.trigger.outputs.source_branch }}\`"
            echo
            echo "Lina revision: \`${{ steps.revisions.outputs.lina }}\`"
            echo
            echo "Luna revision: \`${{ steps.revisions.outputs.luna }}\`"
            echo
            echo "Docker Web revision: \`${{ steps.revisions.outputs.web }}\`"
            echo
            echo "Image: \`${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
