name: Build Complete EE Web Image

on:
  push:
    # Customer branches must carry this workflow to receive push events.
    branches: ['**@**']
  workflow_dispatch:
    inputs:
      branch:
        description: '匹配分支，如 ferror@v4.10.19-lts；依次匹配同名、@ 后基线、dev'
        required: false
        default: ''
        type: string
      lina_branch:
        description: 'Lina 覆盖引用（分支/tag/SHA）；留空自动匹配'
        required: false
        default: ''
        type: string
      luna_branch:
        description: 'Luna 覆盖引用（分支/tag/SHA）；留空自动匹配'
        required: false
        default: ''
        type: string
      web_branch:
        description: 'Docker Web 覆盖引用（分支/tag/SHA）；留空自动匹配'
        required: false
        default: ''
        type: string
      tag:
        description: '镜像标签（不参与源码选择）；留空按匹配分支和时间生成'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: web-${{ inputs.tag || inputs.branch || inputs.web_branch || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.repository == 'jumpserver-east/docker-web' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && !github.event.deleted &&
        github.ref_type == 'branch' && contains(github.ref_name, '@')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WEB_BRANCH: ${{ github.event_name == 'workflow_dispatch' && (inputs.branch || inputs.web_branch || 'dev') || github.ref_name }}
      REQUESTED_TAG: ${{ inputs.tag }}
      ALIYUN_ENABLED: ${{ secrets.ALIYUN_REGION != '' && secrets.ALIYUN_USERNAME != '' && secrets.ALIYUN_PASSWORD != '' }}

    steps:
      - name: Check out build configuration
        uses: actions/checkout@v4
        with:
          ref: docker-build
          fetch-depth: 1

      - name: Resolve matching component branches
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_REF: ${{ github.sha }}
          LINA_OVERRIDE: ${{ inputs.lina_branch }}
          LUNA_OVERRIDE: ${{ inputs.luna_branch }}
          WEB_OVERRIDE: ${{ inputs.web_branch }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == workflow_dispatch ]]; then
            python3 .github/scripts/resolve-web-refs.py \
              --source-branch "${WEB_BRANCH}" \
              --lina-ref "${LINA_OVERRIDE}" \
              --luna-ref "${LUNA_OVERRIDE}" \
              --web-ref "${WEB_OVERRIDE}" >> "${GITHUB_ENV}"
          else
            python3 .github/scripts/resolve-web-refs.py \
              --component web \
              --source-branch "${WEB_BRANCH}" \
              --source-ref "${TRIGGER_REF}" >> "${GITHUB_ENV}"
          fi

      - name: Show selected source references
        shell: bash
        run: |
          {
            echo '### Selected source references'
            echo
            printf 'Matching branch: `%s`\n\n' "${WEB_BRANCH}"
            printf 'Lina: `%s`\n\n' "${LINA_REF}"
            printf 'Luna: `%s`\n\n' "${LUNA_REF}"
            printf 'Docker Web: `%s`\n' "${WEB_REF}"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Check out Docker Web source
        uses: actions/checkout@v4
        with:
          repository: jumpserver-east/docker-web
          ref: ${{ env.WEB_REF }}
          path: web-source
          fetch-depth: 1

      - name: Prepare tag
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED_TAG}" ]; then
            raw_tag="${REQUESTED_TAG}"
          else
            timestamp="$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M%S')"
            raw_tag="${WEB_BRANCH}-${timestamp}"
          fi

          tag="$(
            printf '%s' "${raw_tag}" |
              tr '[:upper:]' '[:lower:]' |
              sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' |
              cut -c1-128
          )"

          if [ -z "${tag}" ]; then
            echo "Image tag is empty after normalization." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build Lina, Luna, and complete EE Web image
        uses: docker/bake-action@v6
        env:
          GHCR_IMAGE: ghcr.io/jumpserver-east/web
          TAG: ${{ steps.metadata.outputs.tag }}
        with:
          source: .
          files: docker-bake.ghcr.hcl
          targets: web-ee
          push: true
          provenance: false
          sbom: false
          set: "*.platform=linux/amd64"

      - name: Push to Aliyun
        if: env.ALIYUN_ENABLED == 'true'
        shell: bash
        env:
          ALIYUN_REGION: ${{ secrets.ALIYUN_REGION }}
          IMAGE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail

          echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login --username ${{ secrets.ALIYUN_USERNAME }} ${{ secrets.ALIYUN_REGION }} --password-stdin
          docker pull "ghcr.io/jumpserver-east/web:${IMAGE_TAG}"
          docker tag "ghcr.io/jumpserver-east/web:${IMAGE_TAG}" "${ALIYUN_REGION}/fit2cloud_nickyang0_0/web:${IMAGE_TAG}"
          docker push "${ALIYUN_REGION}/fit2cloud_nickyang0_0/web:${IMAGE_TAG}"

      - name: Verify GHCR package is private
        shell: bash
        run: |
          set -euo pipefail

          status="$(
            curl --silent --output /dev/null --write-out '%{http_code}' \
              "https://ghcr.io/token?scope=repository%3Ajumpserver-east%2Fweb%3Apull"
          )"

          if [ "${status}" != "401" ]; then
            echo "Expected private GHCR package, anonymous token request returned HTTP ${status}." >&2
            exit 1
          fi

      - name: Publish summary
        shell: bash
        env:
          ALIYUN_REGION: ${{ secrets.ALIYUN_REGION }}
        run: |
          {
            echo "### Complete JumpServer EE Web image"
            echo
            echo "Lina: \`${LINA_REF}\`"
            echo
            echo "Luna: \`${LUNA_REF}\`"
            echo
            echo "Docker Web: \`${WEB_REF}\`"
            echo
            echo "GHCR: \`ghcr.io/jumpserver-east/web:${{ steps.metadata.outputs.tag }}\`"
            echo
            if [ "${ALIYUN_ENABLED}" = "true" ]; then
              echo "Aliyun: \`${ALIYUN_REGION}/fit2cloud_nickyang0_0/web:${{ steps.metadata.outputs.tag }}\`"
            else
              echo "Aliyun: skipped (secrets are not configured)"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
