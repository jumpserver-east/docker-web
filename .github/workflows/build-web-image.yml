name: Build Complete Web Image to GHCR

on:
  create:
  workflow_run:
    workflows:
      - JumpServer repos generic handler
    types:
      - completed
  workflow_dispatch:
    inputs:
      lina_branch:
        description: Lina branch, tag, or commit SHA
        required: true
        default: dev
        type: string
      luna_branch:
        description: Luna branch, tag, or commit SHA
        required: true
        default: dev
        type: string
      web_branch:
        description: Docker Web branch, tag, or commit SHA
        required: true
        default: dev
        type: string
      tag:
        description: Docker image tag
        required: true
        default: dev-manual
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: web-${{ inputs.tag || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'create' && github.event.ref_type == 'branch') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LINA_REF: ${{ inputs.lina_branch || 'dev' }}
      LUNA_REF: ${{ inputs.luna_branch || 'dev' }}
      WEB_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.web_branch || github.event.workflow_run.head_sha || github.event.ref }}
      WEB_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.web_branch || github.event.workflow_run.head_branch || github.event.ref }}
      REQUESTED_TAG: ${{ inputs.tag }}

    steps:
      - name: Check out build configuration
        uses: actions/checkout@v4
        with:
          ref: docker-build
          fetch-depth: 1

      - name: Check out Docker Web source
        uses: actions/checkout@v4
        with:
          repository: jumpserver-east/docker-web
          ref: ${{ env.WEB_REF }}
          path: web-source
          fetch-depth: 1

      - name: Prepare tag
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED_TAG}" ]; then
            raw_tag="${REQUESTED_TAG}"
          else
            timestamp="$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M%S')"
            raw_tag="${WEB_BRANCH}-${timestamp}"
          fi

          tag="$(
            printf '%s' "${raw_tag}" |
              tr '[:upper:]' '[:lower:]' |
              sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' |
              cut -c1-128
          )"

          if [ -z "${tag}" ]; then
            echo "Image tag is empty after normalization." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build Lina, Luna, and complete Web image
        uses: docker/bake-action@v6
        env:
          IMAGE: ghcr.io/jumpserver-east/web
          TAG: ${{ steps.metadata.outputs.tag }}
        with:
          files: docker-bake.ghcr.hcl
          targets: web
          push: true
          set: "*.platform=linux/amd64"

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "### Complete JumpServer Web image"
            echo
            echo "Lina: \`${LINA_REF}\`"
            echo
            echo "Luna: \`${LUNA_REF}\`"
            echo
            echo "Docker Web: \`${WEB_REF}\`"
            echo
            echo "Image: \`ghcr.io/jumpserver-east/web:${{ steps.metadata.outputs.tag }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
