name: Reusable Component Image Build

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      source_branch:
        required: true
        type: string
      image_tag:
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Prepare tag
        id: metadata
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED_TAG}" ]; then
            raw_tag="${REQUESTED_TAG}"
          else
            timestamp="$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M%S')"
            raw_tag="${SOURCE_BRANCH}-${timestamp}"
          fi

          tag="$(
            printf '%s' "${raw_tag}" |
              tr '[:upper:]' '[:lower:]' |
              sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' |
              cut -c1-128
          )"

          if [ -z "${tag}" ]; then
            echo "Image tag is empty after normalization." >&2
            exit 1
          fi

          echo "revision=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: VERSION=${{ steps.metadata.outputs.tag }}
          tags: ghcr.io/jumpserver-east/${{ github.event.repository.name }}:${{ steps.metadata.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.metadata.outputs.revision }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.tag }}
          cache-from: type=gha,scope=${{ github.event.repository.name }}
          cache-to: type=gha,mode=max,scope=${{ github.event.repository.name }}

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "### Component image"
            echo
            echo "Branch: \`${{ inputs.source_branch }}\`"
            echo
            echo "Image: \`ghcr.io/jumpserver-east/${{ github.event.repository.name }}:${{ steps.metadata.outputs.tag }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
