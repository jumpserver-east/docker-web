name: Reusable EE Component Image Build

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      source_branch:
        required: true
        type: string
      image_tag:
        required: false
        default: ""
        type: string
    secrets:
      ALIYUN_REGION:
        required: true
      ALIYUN_USERNAME:
        required: true
      ALIYUN_PASSWORD:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Check out build configuration
        uses: actions/checkout@v4
        with:
          repository: jumpserver-east/docker-web
          ref: docker-build
          path: .build-config
          fetch-depth: 1

      - name: Prepare tag
        id: metadata
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED_TAG}" ]; then
            raw_tag="${REQUESTED_TAG}"
          else
            timestamp="$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M%S')"
            raw_tag="${SOURCE_BRANCH}-${timestamp}"
          fi

          tag="$(
            printf '%s' "${raw_tag}" |
              tr '[:upper:]' '[:lower:]' |
              sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' |
              cut -c1-128
          )"

          if [ -z "${tag}" ]; then
            echo "Image tag is empty after normalization." >&2
            exit 1
          fi

          if [ "${GITHUB_REPOSITORY#*/}" = "jumpserver" ]; then
            echo "base_image=core" >> "${GITHUB_OUTPUT}"
            echo "target=ee-core" >> "${GITHUB_OUTPUT}"
          else
            echo "base_image=${GITHUB_REPOSITORY#*/}" >> "${GITHUB_OUTPUT}"
            echo "target=ee" >> "${GITHUB_OUTPUT}"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Aliyun
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGION }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push EE image
        uses: docker/bake-action@v6
        env:
          ALIYUN_IMAGE: ${{ secrets.ALIYUN_REGION }}/fit2cloud_nickyang0_0/${{ github.event.repository.name }}
          BASE_IMAGE: ${{ steps.metadata.outputs.base_image }}
          GHCR_IMAGE: ghcr.io/jumpserver-east/${{ github.event.repository.name }}
          TAG: ${{ steps.metadata.outputs.tag }}
        with:
          files: .build-config/docker-bake.component.hcl
          targets: ${{ steps.metadata.outputs.target }}
          push: true
          set: "*.platform=linux/amd64"

      - name: Verify GHCR package is private
        shell: bash
        run: |
          set -euo pipefail

          status="$(
            curl --silent --output /dev/null --write-out '%{http_code}' \
              "https://ghcr.io/token?scope=repository%3Ajumpserver-east%2F${GITHUB_REPOSITORY#*/}%3Apull"
          )"

          if [ "${status}" != "401" ]; then
            echo "Expected private GHCR package, anonymous token request returned HTTP ${status}." >&2
            exit 1
          fi

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "### EE component image"
            echo
            echo "Branch: \`${{ inputs.source_branch }}\`"
            echo
            echo "GHCR: \`ghcr.io/jumpserver-east/${{ github.event.repository.name }}:${{ steps.metadata.outputs.tag }}\`"
            echo
            echo "Aliyun: \`${{ secrets.ALIYUN_REGION }}/fit2cloud_nickyang0_0/${{ github.event.repository.name }}:${{ steps.metadata.outputs.tag }}\`"
            if [ "${GITHUB_REPOSITORY#*/}" = "jumpserver" ]; then
              echo
              echo "> xpack currently uses an empty placeholder target."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
